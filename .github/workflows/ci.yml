name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "Cloudflare Tunnel.slnx"

      - name: Build
        run: dotnet build "Cloudflare Tunnel.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Cloudflare Tunnel.slnx" --configuration Release --no-build
